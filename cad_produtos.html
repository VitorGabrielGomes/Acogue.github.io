<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho-pequeno">
        <h1>Açougue Bem Passado</h1>
        <p>Cadastro de Produtos</p>
    </header>

    <!-- Menu -->
    <nav>
        <a href="index.html">Início</a>
        <a href="cad_clientes.html">Clientes</a>
        <a href="cad_funcionarios.html">Funcionários</a>
        <a href="cad_produtos.html">Produtos</a>
    </nav>

    <!-- Formulário -->
    <main>

        <div class="formulario">

            <h2>Cadastro de Produto</h2>

            <form id="formProduto">

                <label for="codigo">Código:</label>
                <input type="number"
                       id="codigo"
                       name="codigo"
                       placeholder="Digite o código"
                       required>

                <label for="produto">Nome do Produto:</label>
                <input type="text"
                       id="produto"
                       name="produto"
                       placeholder="Digite o produto"
                       required>

                <label for="categoria">Categoria:</label>

                <select id="categoria"
                        name="categoria"
                        required>

                    <option value="">Selecione</option>
                    <option value="Alimentos">Alimentos</option>
                    <option value="Bebidas">Bebidas</option>
                    <option value="Higiene">Higiene</option>
                    <option value="Limpeza">Limpeza</option>
                    <option value="Hortifruti">Hortifruti</option>

                </select>

                <label for="preco">Preço:</label>
                <input type="number"
                       id="preco"
                       name="preco"
                       step="0.01"
                       placeholder="Digite o preço"
                       required>

                <label for="quantidade">Quantidade em Estoque:</label>
                <input type="number"
                       id="quantidade"
                       name="quantidade"
                       placeholder="Digite a quantidade"
                       required>

                <button type="submit">Cadastrar</button>

                <button type="reset" class="botao-limpar">
                    Limpar
                </button>

            </form>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 - Açougue Bem Passado</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
