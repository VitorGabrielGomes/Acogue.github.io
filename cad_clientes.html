<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Clientes</title>

    <link rel="stylesheet" href="css/estilo.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho-pequeno">
        <h1>Açougue Bem Passado</h1>
        <p>Cadastro de Clientes</p>
    </header>

    <!-- Menu -->
    <nav>
        <a href="index.html">Início</a>
        <a href="cad_clientes.html">Clientes</a>
        <a href="cad_funcionarios.html">Funcionários</a>
        <a href="cad_produtos.html">Produtos</a>
    </nav>

    <!-- Formulário -->
    <main>

        <div class="formulario">

            <h2>Cadastro de Cliente</h2>

            <form id="formCliente">

                <label for="nome">Nome:</label>
                <input type="text"
                       id="nome"
                       name="nome"
                       placeholder="Digite o nome"
                       required>

                <label for="cpf">CPF:</label>
                <input type="text"
                       id="cpf"
                       name="cpf"
                       placeholder="Digite o CPF"
                       required>

                <label for="telefone">Telefone:</label>
                <input type="tel"
                       id="telefone"
                       name="telefone"
                       placeholder="Digite o telefone">

                <label for="email">E-mail:</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Digite o e-mail">

                <label for="endereco">Endereço:</label>
                <input type="text"
                       id="endereco"
                       name="endereco"
                       placeholder="Digite o endereço">

                <button type="submit">Cadastrar</button>

                <button type="reset" class="botao-limpar">
                    Limpar
                </button>

            </form>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 - Açougue Bem Passado</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
